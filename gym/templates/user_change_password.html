{% extends 'base.html' %}
{% load static %}

{% block title %}Change Account Password | FITCORE{% endblock %}

{% block content %}
<div class="inner-page-wrapper" style="min-height: 85vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="custom-form p-5">
                    <div class="text-center mb-4">
                        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(245,158,11,0.15); display: inline-flex; align-items: center; justify-content: center; color: var(--accent); font-size: 26px; margin-bottom: 12px;">
                            <i class="fa fa-key"></i>
                        </div>
                        <h2 class="text-white font-weight-bold mb-1" style="font-size: 24px;">Security & Password</h2>
                        <p class="text-muted" style="font-size: 13.5px;">Update your account credentials safely</p>
                    </div>

                    <form method="post" action="{% url 'user_change_password' %}">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label class="text-white font-weight-bold" style="font-size: 13px;">Current Password *</label>
                            <input type="password" name="pwd3" class="custom-input mb-1" placeholder="Enter current password" required>
                        </div>

                        <div class="form-group mb-3">
                            <label class="text-white font-weight-bold" style="font-size: 13px;">New Password (Min. 6 chars) *</label>
                            <input type="password" name="pwd1" class="custom-input mb-1" placeholder="Enter new password" minlength="6" required>
                        </div>

                        <div class="form-group mb-4">
                            <label class="text-white font-weight-bold" style="font-size: 13px;">Confirm New Password *</label>
                            <input type="password" name="pwd2" class="custom-input mb-1" placeholder="Re-type new password" minlength="6" required>
                        </div>

                        <button type="submit" class="btn-primary-custom w-100 border-0">
                            Update Password Now <i class="fa fa-shield-halved"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border);">
                        <a href="{% url 'member_dashboard' %}" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">
                            &larr; Back to Member Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
