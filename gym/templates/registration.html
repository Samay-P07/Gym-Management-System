{% extends 'base.html' %}
{% load static %}

{% block title %}Create Member Account | FITCORE{% endblock %}

{% block content %}
<div class="inner-page-wrapper" style="min-height: 85vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-10">
                <div class="custom-form p-5">
                    <div class="text-center mb-4">
                        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(244,63,94,0.15); display: inline-flex; align-items: center; justify-content: center; color: var(--primary); font-size: 26px; margin-bottom: 12px;">
                            <i class="fa fa-id-card"></i>
                        </div>
                        <h2 class="text-white font-weight-bold mb-1" style="font-size: 26px;">Become A FITCORE Member</h2>
                        <p class="text-muted" style="font-size: 13.5px;">Register for instant pass activation and scheduling</p>
                    </div>

                    <form method="post" action="{% url 'registration' %}">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">First Name *</label>
                                    <input type="text" name="firstname" class="custom-input mb-1" placeholder="e.g. Samay" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Last Name *</label>
                                    <input type="text" name="secondname" class="custom-input mb-1" placeholder="e.g. Patel" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Email Address *</label>
                                    <input type="email" name="email" class="custom-input mb-1" placeholder="e.g. samay@example.com" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Phone / Mobile *</label>
                                    <input type="text" name="mobile" class="custom-input mb-1" placeholder="e.g. +91 98765 43210" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Street Address</label>
                                    <input type="text" name="address" class="custom-input mb-1" placeholder="e.g. Bodakdev, Ahmedabad" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">City</label>
                                    <input type="text" name="city" class="custom-input mb-1" value="Ahmedabad" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">State</label>
                                    <input type="text" name="state" class="custom-input mb-1" value="Gujarat" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group mb-4">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Password (Min. 6 chars) *</label>
                                    <input type="password" name="password" class="custom-input mb-1" placeholder="Create a strong password" minlength="6" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn-primary-custom w-100 border-0">
                                    Complete Registration & Join <i class="fa fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border);">
                        <a href="{% url 'user_login' %}" style="color: var(--text-muted); font-size: 13.5px; text-decoration: none;">
                            Already have an account? <span style="color: var(--primary); font-weight: 600;">Sign In Here</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
