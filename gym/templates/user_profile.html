{% extends 'base.html' %}
{% load static %}

{% block title %}My Profile & Account Settings | FITCORE{% endblock %}

{% block content %}
<div class="inner-page-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="custom-form p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4 pb-3" style="border-bottom: 1px solid var(--border);">
                        <div>
                            <span class="section-tag mb-1">MEMBER IDENTITY</span>
                            <h2 class="text-white font-weight-bold mb-0" style="font-size: 26px;">Personal Profile Settings</h2>
                        </div>
                        <a href="{% url 'member_dashboard' %}" class="btn-secondary-custom py-1 px-3" style="font-size:12px;">
                            <i class="fa fa-id-card"></i> View Pass
                        </a>
                    </div>

                    <form method="post" action="{% url 'user_profile' %}">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">First Name</label>
                                    <input type="text" name="firstname" class="custom-input mb-1" value="{{ request.user.first_name }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Last Name</label>
                                    <input type="text" name="secondname" class="custom-input mb-1" value="{{ request.user.last_name }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Email Address</label>
                                    <input type="email" name="email" class="custom-input mb-1" value="{{ request.user.email }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Contact Mobile</label>
                                    <input type="text" name="mobile" class="custom-input mb-1" value="{{ data.mobile|default:'' }}" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">Residential Address</label>
                                    <input type="text" name="address" class="custom-input mb-1" value="{{ data.address|default:'' }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">City</label>
                                    <input type="text" name="city" class="custom-input mb-1" value="{{ data.city|default:'Ahmedabad' }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="text-white font-weight-bold" style="font-size: 13px;">State</label>
                                    <input type="text" name="state" class="custom-input mb-1" value="{{ data.state|default:'Gujarat' }}" required>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <button type="submit" class="btn-primary-custom w-100 border-0">
                                    Save Profile Updates <i class="fa fa-save"></i>
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="mt-4 pt-3 text-center" style="border-top: 1px solid var(--border);">
                        <a href="{% url 'user_change_password' %}" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">
                            Need to update your password? <span style="color: var(--accent); font-weight: 600;">Change Password Here &rarr;</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
